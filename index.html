<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mathematical Methods — St Edmund's College</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#002d6e;--navy2:#003580;--navy3:#0a3d8f;
  --nl:#e8eef8;--nm:#c5d3ea;--nl2:#f0f4fb;
  --gold:#c9a227;--gold2:#e0b535;--gl:#fdf6e3;--gm:#f0d890;
  --white:#fff;--off:#f7f9fc;
  --text:#1a2540;--t2:#4a5878;--t3:#8a95b0;
  --bd:#dde3ef;--bd2:#c5d0e8;
  --grn:#1a7a4a;--gbg:#e8f5ee;
  --red:#dc2626;--redbg:#fef2f2;
  --amb:#b86e00;--abg:#fef3e2;
  --sw:272px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:'Inter',system-ui,sans-serif;background:var(--off);color:var(--text);display:flex;flex-direction:column}

/* ── TOPBAR ── */
.topbar{height:60px;background:var(--navy);display:flex;align-items:center;padding:0 20px;gap:12px;flex-shrink:0;box-shadow:0 2px 8px rgba(0,45,110,0.2)}
.brand{display:flex;align-items:center;gap:10px;flex:1}
.crest{height:44px;width:auto}
.bname{font-size:14px;font-weight:700;color:#fff;letter-spacing:-0.01em}
.bsub{font-size:10px;color:var(--gold2);font-weight:500}
.tdiv{width:1px;height:24px;background:rgba(255,255,255,0.15)}
.course{font-size:12px;color:rgba(255,255,255,0.6);font-weight:500}
.top-tabs{display:flex;align-items:stretch;margin-left:auto}
.top-tab{padding:0 16px;font-size:13px;font-weight:600;color:rgba(255,255,255,0.65);cursor:pointer;border:none;background:none;font-family:inherit;display:flex;align-items:center;gap:6px;border-bottom:3px solid transparent;transition:all 0.15s}
.top-tab:hover{color:#fff;background:rgba(255,255,255,0.06)}
.top-tab.active{color:#fff;border-bottom-color:var(--gold2)}
.mood-pill{display:flex;align-items:center;gap:5px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.12);border-radius:20px;padding:5px 12px;margin-left:8px}
.mpl{font-size:10px;font-weight:700;color:rgba(255,255,255,0.4);text-transform:uppercase;letter-spacing:0.08em}
.me{font-size:18px;cursor:pointer;border-radius:5px;padding:1px 3px;border:1px solid transparent;transition:all 0.15s;line-height:1}
.me:hover{transform:scale(1.2);background:rgba(255,255,255,0.1)}
.me.on{border-color:var(--gold);background:rgba(201,162,39,0.2)}
.streak{font-size:11px;color:var(--gold2);font-weight:600}

/* ── APP ── */
.app{display:flex;flex:1;min-height:0;overflow:hidden}

/* ── SIDEBAR ── */
.sb{width:var(--sw);flex-shrink:0;background:var(--white);border-right:1px solid var(--bd);display:flex;flex-direction:column;overflow:hidden}
.sb-head{padding:14px 12px 10px;border-bottom:1px solid var(--bd);flex-shrink:0}
.sb-prog-row{display:flex;justify-content:space-between;font-size:10px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:6px}
.sb-prog-row strong{color:var(--navy)}
.prog-track{height:5px;background:var(--nl);border-radius:5px;overflow:hidden}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--navy),var(--gold));border-radius:5px;transition:width 0.8s ease}
.sb-scroll{flex:1;overflow-y:auto;padding:6px}
.sb-sec{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;color:var(--t3);padding:8px 6px 4px}
.wk-btn{display:flex;align-items:center;gap:8px;padding:8px;border-radius:8px;cursor:pointer;transition:all 0.15s;border:1px solid transparent;margin-bottom:2px;width:100%;background:none;text-align:left;font-family:inherit}
.wk-btn:hover{background:var(--nl)}
.wk-btn.sel{background:var(--nl);border-color:var(--nm)}
.wk-ring{width:28px;height:28px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}
.ring-done{background:var(--gbg);color:var(--grn)}
.ring-cur{background:var(--navy);color:#fff}
.ring-soon{background:var(--nl);color:var(--t3);border:1px solid var(--bd2)}
.wk-info{flex:1;min-width:0}
.wk-n{font-size:9px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:0.06em;font-family:'JetBrains Mono',monospace}
.wk-t{font-size:11px;font-weight:500;color:var(--t2);line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.wk-btn.sel .wk-t{color:var(--navy);font-weight:600}
.sb-foot{padding:10px 8px;border-top:1px solid var(--bd);flex-shrink:0}
.term-btn{display:flex;align-items:center;justify-content:center;gap:5px;padding:9px;border-radius:7px;background:var(--gl);border:1px solid var(--gm);color:var(--amb);font-size:11px;font-weight:600;text-decoration:none;transition:all 0.15s}
.term-btn:hover{background:var(--gm)}

/* ── MAIN ── */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
#main-panel{flex:1;display:flex;flex-direction:column;overflow:hidden}

/* ── WEEK OVERVIEW ── */
.wk-overview{flex:1;overflow-y:auto;padding:26px 32px}
.ov-eyebrow{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;color:var(--gold);margin-bottom:4px}
.ov-title{font-size:22px;font-weight:700;color:var(--navy);letter-spacing:-0.02em;margin-bottom:4px}
.ov-meta{font-size:12px;color:var(--t3);margin-bottom:22px}
.lesson-list{display:flex;flex-direction:column;gap:8px}
.ls-card{display:flex;align-items:center;gap:14px;padding:14px 18px;background:var(--white);border:1px solid var(--bd);border-radius:10px;cursor:pointer;transition:all 0.2s}
.ls-card:hover{border-color:var(--navy);box-shadow:0 2px 10px rgba(0,45,110,0.08);transform:translateX(3px)}
.ls-card.today{border-color:var(--navy);background:var(--nl)}
.ls-num{width:32px;height:32px;border-radius:8px;background:var(--nl);color:var(--navy);font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-family:'JetBrains Mono',monospace}
.ls-card.today .ls-num{background:var(--navy);color:#fff}
.ls-info{flex:1;min-width:0}
.ls-day{font-size:13px;font-weight:600;color:var(--text)}
.ls-date{font-size:11px;color:var(--t3);font-family:'JetBrains Mono',monospace;margin-top:1px}
.ls-preview{font-size:12px;color:var(--t2);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:400px}
.ls-period-badge{font-size:10px;font-weight:600;color:var(--t3);background:var(--off);border:1px solid var(--bd);padding:3px 8px;border-radius:10px;white-space:nowrap;flex-shrink:0}
.ls-today-badge{font-size:10px;font-weight:700;color:var(--navy);background:var(--gold2);padding:3px 8px;border-radius:10px;white-space:nowrap;flex-shrink:0}
.ls-arrow{color:var(--bd2);font-size:16px;flex-shrink:0;transition:color 0.15s}
.ls-card:hover .ls-arrow{color:var(--navy)}
.hw-strip{display:flex;align-items:center;gap:10px;margin-top:18px;padding:14px 18px;background:var(--white);border:1px solid var(--bd);border-radius:10px}
.hw-strip-label{font-size:12px;font-weight:600;color:var(--t2);flex:1}
.hw-strip-btn{display:inline-flex;align-items:center;gap:6px;padding:7px 16px;border-radius:7px;background:var(--navy);color:#fff;font-size:12px;font-weight:600;text-decoration:none;transition:all 0.15s}
.hw-strip-btn:hover{background:var(--navy2)}
.hw-strip-btn.nohw{background:var(--off);color:var(--t3);border:1px solid var(--bd);pointer-events:none}

/* ── LESSON DETAIL ── */
.lesson-detail{flex:1;display:flex;flex-direction:column;overflow:hidden}
.lesson-scroll{flex:1;overflow-y:auto;padding:22px 32px}
.back-btn{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--t2);cursor:pointer;border:none;background:none;font-family:inherit;padding:0;margin-bottom:18px;transition:color 0.15s}
.back-btn:hover{color:var(--navy)}
.lesson-card{background:var(--white);border:1px solid var(--bd);border-radius:12px;overflow:hidden}
.lesson-topbar{display:flex;align-items:center;gap:10px;padding:13px 18px;background:var(--off);border-bottom:1px solid var(--bd)}
.l-day-badge{background:var(--navy);color:#fff;font-size:10px;font-weight:700;padding:4px 10px;border-radius:6px;text-transform:uppercase;letter-spacing:0.04em}
.l-date{font-size:12px;color:var(--t2);font-family:'JetBrains Mono',monospace}
.l-period{font-size:12px;color:var(--t3);font-style:italic;margin-left:auto}
.lesson-body{padding:20px}
.sec-hdr{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:var(--navy);margin:16px 0 6px;display:flex;align-items:center;gap:5px}
.sec-hdr:first-child{margin-top:0}
.intent-block{font-size:13px;color:var(--t2);line-height:1.65;padding:10px 12px;background:var(--nl);border-left:3px solid var(--navy);border-radius:0 6px 6px 0}
.crit-item{display:flex;align-items:flex-start;gap:8px;font-size:13px;color:var(--t2);line-height:1.55;padding:6px 0;border-bottom:1px solid var(--bd)}
.crit-item:last-child{border-bottom:none}
.crit-dot{width:5px;height:5px;border-radius:50%;background:var(--navy);flex-shrink:0;margin-top:6px}
.act-chip{font-size:12px;color:var(--t2);padding:7px 10px;background:var(--off);border:1px solid var(--bd);border-radius:6px;margin-bottom:3px;line-height:1.4}
.res-row{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--t3);padding:3px 0}
.res-row::before{content:"↗";font-size:10px;color:var(--navy);flex-shrink:0}
.file-chip{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;background:var(--nl);border:1px solid var(--nm);border-radius:6px;font-size:12px;color:var(--navy);font-weight:600;text-decoration:none;margin:3px 3px 3px 0;transition:all 0.15s}
.file-chip:hover{background:var(--nm)}
.exp-box{margin-top:18px;padding:14px 16px;background:var(--abg);border:1px solid #f5d9a8;border-radius:10px}
.exp-lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:var(--amb);margin-bottom:8px}
.exp-ta{width:100%;background:var(--white);border:1px solid #f0d090;border-radius:6px;padding:10px 12px;font-size:13px;color:var(--text);font-family:inherit;min-height:72px;resize:vertical;line-height:1.5;transition:border-color 0.2s}
.exp-ta:focus{outline:none;border-color:var(--gold)}
.exp-ta::placeholder{color:var(--t3)}
.exp-save{margin-top:8px;padding:6px 14px;background:var(--white);border:1px solid #f0d090;border-radius:6px;color:var(--amb);font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;transition:all 0.15s}
.exp-save:hover{background:var(--gl);border-color:var(--gold)}
.exp-ok{font-size:11px;color:var(--grn);margin-left:8px;display:none}
.nav-footer{padding:12px 32px;border-top:1px solid var(--bd);display:flex;align-items:center;gap:12px;background:var(--white);flex-shrink:0}
.nav-btn{display:flex;align-items:center;gap:6px;padding:8px 16px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;border:1px solid var(--bd2);background:var(--white);color:var(--t2);font-family:inherit;transition:all 0.15s}
.nav-btn:hover:not(:disabled){border-color:var(--navy);color:var(--navy);background:var(--nl)}
.nav-btn:disabled{opacity:0.3;cursor:not-allowed}
.nav-btn.primary{background:var(--navy);color:#fff;border-color:var(--navy)}
.nav-btn.primary:hover:not(:disabled){background:var(--navy2)}
.nav-center{flex:1;text-align:center;font-size:12px;color:var(--t3)}

/* ── EDITOR ── */
.ed-lock{flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;padding:40px}
.ed-lock-card{background:var(--white);border:1px solid var(--bd);border-radius:16px;padding:40px;text-align:center;max-width:380px;width:100%}
.ed-lock-icon{font-size:40px;margin-bottom:12px}
.ed-lock-title{font-size:18px;font-weight:700;color:var(--navy);margin-bottom:4px}
.ed-lock-sub{font-size:13px;color:var(--t2);margin-bottom:20px;line-height:1.5}
.ed-pw-input{width:100%;border:1px solid var(--bd2);border-radius:8px;padding:11px 14px;font-size:15px;text-align:center;letter-spacing:4px;font-family:inherit;transition:border-color 0.2s;margin-bottom:10px}
.ed-pw-input:focus{outline:none;border-color:var(--navy)}
.ed-unlock-btn{width:100%;padding:11px;border-radius:8px;background:var(--navy);color:#fff;border:none;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;transition:background 0.15s}
.ed-unlock-btn:hover{background:var(--navy2)}
.ed-err{font-size:12px;color:var(--red);margin-top:6px;min-height:16px}
.ed-wrap{flex:1;display:flex;overflow:hidden}
.ed-sidebar{width:260px;flex-shrink:0;background:var(--white);border-right:1px solid var(--bd);display:flex;flex-direction:column;overflow:hidden}
.ed-sb-head{padding:16px 14px;border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.ed-sb-title{font-size:13px;font-weight:700;color:var(--navy)}
.ed-add-wk{padding:6px 12px;border-radius:6px;background:var(--navy);color:#fff;border:none;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;transition:background 0.15s}
.ed-add-wk:hover{background:var(--navy2)}
.ed-wk-list{flex:1;overflow-y:auto;padding:6px}
.ed-wk-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;cursor:pointer;border:1px solid transparent;margin-bottom:2px;transition:all 0.15s}
.ed-wk-item:hover{background:var(--nl)}
.ed-wk-item.sel{background:var(--nl);border-color:var(--nm)}
.ed-wk-num{font-size:10px;font-weight:700;color:var(--t3);font-family:'JetBrains Mono',monospace;min-width:24px}
.ed-wk-name{font-size:12px;font-weight:500;color:var(--t2);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ed-wk-item.sel .ed-wk-name{color:var(--navy);font-weight:600}
.ed-wk-del{padding:2px 6px;border-radius:4px;border:none;background:none;color:var(--t3);cursor:pointer;font-size:14px;opacity:0;transition:all 0.15s}
.ed-wk-item:hover .ed-wk-del{opacity:1}
.ed-wk-del:hover{background:var(--redbg);color:var(--red)}
.ed-main{flex:1;overflow-y:auto;padding:24px 28px}
.ed-section{margin-bottom:28px}
.ed-section-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:var(--t3);margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between}
.ed-row{display:grid;gap:10px;margin-bottom:10px}
.ed-row.two{grid-template-columns:1fr 1fr}
.ed-row.three{grid-template-columns:1fr 1fr 1fr}
.ed-field{display:flex;flex-direction:column;gap:4px}
.ed-label{font-size:11px;font-weight:600;color:var(--t2);text-transform:uppercase;letter-spacing:0.04em}
.ed-input{border:1px solid var(--bd2);border-radius:7px;padding:9px 11px;font-size:13px;font-family:inherit;color:var(--text);transition:border-color 0.2s;background:var(--white)}
.ed-input:focus{outline:none;border-color:var(--navy)}
.ed-textarea{border:1px solid var(--bd2);border-radius:7px;padding:9px 11px;font-size:13px;font-family:inherit;color:var(--text);resize:vertical;min-height:80px;line-height:1.5;transition:border-color 0.2s;background:var(--white)}
.ed-textarea:focus{outline:none;border-color:var(--navy)}
.ed-hint{font-size:11px;color:var(--t3);margin-top:2px}
.ed-lesson-list{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.ed-lesson-item{background:var(--white);border:1px solid var(--bd);border-radius:10px;overflow:hidden}
.ed-lesson-head{display:flex;align-items:center;gap:10px;padding:10px 14px;cursor:pointer;user-select:none;transition:background 0.15s}
.ed-lesson-head:hover{background:var(--off)}
.ed-lesson-num{font-size:10px;font-weight:700;color:var(--t3);font-family:'JetBrains Mono',monospace;min-width:20px}
.ed-lesson-label{flex:1;font-size:13px;font-weight:500;color:var(--text)}
.ed-lesson-del{padding:3px 8px;border-radius:5px;border:none;background:none;color:var(--t3);cursor:pointer;font-size:12px;font-weight:600;transition:all 0.15s}
.ed-lesson-del:hover{background:var(--redbg);color:var(--red)}
.ed-lesson-body{display:none;padding:14px;border-top:1px solid var(--bd);background:var(--off)}
.ed-lesson-body.open{display:block}
.ed-lesson-chev{color:var(--t3);font-size:12px;transition:transform 0.2s}
.ed-lesson-item.open .ed-lesson-chev{transform:rotate(180deg)}

/* FILES SECTION */
.files-section{margin-top:10px}
.files-list{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.file-tag{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;background:var(--nl);border:1px solid var(--nm);border-radius:6px;font-size:12px;color:var(--navy);font-weight:500}
.file-tag-del{background:none;border:none;color:var(--t3);cursor:pointer;font-size:14px;padding:0;line-height:1;transition:color 0.15s}
.file-tag-del:hover{color:var(--red)}
.file-add-row{display:flex;gap:8px;align-items:stretch}
.file-url-input{flex:1;border:1px solid var(--bd2);border-radius:7px;padding:8px 11px;font-size:12px;font-family:inherit;transition:border-color 0.2s}
.file-url-input:focus{outline:none;border-color:var(--navy)}
.file-url-btn{padding:8px 14px;border-radius:7px;border:none;background:var(--navy);color:#fff;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;white-space:nowrap;transition:background 0.15s}
.file-url-btn:hover{background:var(--navy2)}
.file-drop-zone{border:2px dashed var(--bd2);border-radius:8px;padding:12px;text-align:center;cursor:pointer;transition:all 0.2s;margin-top:6px}
.file-drop-zone:hover,.file-drop-zone.drag{border-color:var(--navy);background:var(--nl)}
.file-drop-label{font-size:12px;color:var(--t2);font-weight:500}
.file-drop-sub{font-size:11px;color:var(--t3);margin-top:2px}
.file-hidden{display:none}
.gh-setup{background:var(--gl);border:1px solid var(--gm);border-radius:8px;padding:12px 14px;margin-bottom:10px}
.gh-setup-title{font-size:11px;font-weight:700;color:var(--amb);margin-bottom:6px;display:flex;align-items:center;gap:5px}
.gh-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.gh-input{border:1px solid #f0d090;border-radius:6px;padding:7px 10px;font-size:12px;font-family:monospace;width:100%;transition:border-color 0.2s}
.gh-input:focus{outline:none;border-color:var(--gold)}
.gh-save-btn{margin-top:8px;padding:7px 14px;border-radius:6px;border:none;background:var(--amb);color:#fff;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;transition:background 0.15s}
.gh-save-btn:hover{background:#9a5c00}
.gh-status{font-size:11px;margin-left:8px}
.upload-prog{font-size:11px;color:var(--t2);margin-top:4px;display:none}

/* SAVE BAR */
.ed-save-bar{padding:12px 28px;border-top:1px solid var(--bd);background:var(--white);display:flex;align-items:center;gap:12px;flex-shrink:0}
.ed-save-btn{padding:9px 22px;border-radius:8px;background:var(--navy);color:#fff;border:none;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;transition:background 0.15s}
.ed-save-btn:hover{background:var(--navy2)}
.ed-lock-btn{padding:9px 16px;border-radius:8px;background:var(--white);color:var(--t2);border:1px solid var(--bd2);font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;transition:all 0.15s}
.ed-lock-btn:hover{border-color:var(--navy);color:var(--navy)}
.ed-pw-change{display:flex;align-items:center;gap:8px;margin-left:auto}
.ed-pw-change-input{border:1px solid var(--bd2);border-radius:6px;padding:7px 10px;font-size:12px;font-family:inherit;width:180px;transition:border-color 0.2s}
.ed-pw-change-input:focus{outline:none;border-color:var(--navy)}
.ed-pw-change-btn{padding:7px 14px;border-radius:6px;background:var(--off);border:1px solid var(--bd2);color:var(--t2);font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;transition:all 0.15s}
.ed-pw-change-btn:hover{border-color:var(--navy);color:var(--navy)}

function getStatus(w){
  var t=new Date();t.setHours(0,0,0,0);
  var s=new Date(w.start),e=new Date(w.end);e.setHours(23,59,59,999);
  return t>e?'past':t>=s?'current':'upcoming';
}
function isToday(dateStr){
  var p=dateStr.split('/');
  if(p.length!==3)return false;
  var t=new Date();
  return parseInt(p[0])===t.getDate()&&parseInt(p[1])===(t.getMonth()+1)&&parseInt(p[2])===t.getFullYear();
}

function switchTab(tab){
  curTab=tab;
  document.querySelectorAll('.top-tab').forEach(function(el){
    el.classList.toggle('active',el.dataset.tab===tab);
  });
  document.getElementById('student-view').style.display=tab==='student'?'flex':'none';
  document.getElementById('editor-view').style.display=tab==='editor'?'flex':'none';
  /* hide edit tab again when returning to student view */
  if(tab==='student'){
    var et=document.getElementById('edit-tab');
    if(et)et.style.display='none';
  }
  if(tab==='editor') renderEditor();
}

══════════════════════════════════════════════ */
function setMood(m){
  var td=new Date().toISOString().split('T')[0];
  MOODS=MOODS.filter(function(x){return x.d!==td;});
  MOODS.push({d:td,m:m});
  if(MOODS.length>30)MOODS=MOODS.slice(-30);
  sv('moods',MOODS);renderMood();
}
function renderMood(){
  var td=new Date().toISOString().split('T')[0];
  var tm=MOODS.find(function(x){return x.d===td;});
  document.querySelectorAll('.me').forEach(function(el){el.classList.toggle('on',!!(tm&&el.dataset.m===tm.m));});
  var str=0,d=new Date();
  for(var i=0;i<30;i++){var ds=d.toISOString().split('T')[0];if(MOODS.find(function(x){return x.d===ds;})){str++;d.setDate(d.getDate()-1);}else break;}
  var sl=document.getElementById('streak');if(sl)sl.textContent=str>1?'🔥'+str:'';
}

function renderSidebar(){
  var nav=document.getElementById('wk-nav');if(!nav)return;
  nav.innerHTML='';
  W.forEach(function(w,wi){
    var st=getStatus(w);
    var rc=st==='past'?'ring-done':st==='current'?'ring-cur':'ring-soon';
    var rv=st==='past'?'✓':st==='current'?'▶':w.n;
    nav.insertAdjacentHTML('beforeend',
      '<button class="wk-btn'+(wi===curWk?' sel':'')+'" onclick="goWeek('+wi+')" id="wkbtn-'+wi+'">'
      +'<div class="wk-ring '+rc+'">'+rv+'</div>'
      +'<div class="wk-info"><div class="wk-n">Week '+w.n+'</div><div class="wk-t">'+esc(w.title)+'</div></div>'
      +'</button>'
    );
  });
  var done=W.filter(function(w){return getStatus(w)==='past';}).length;
  var pct=W.length>0?Math.round(done/W.length*100):0;
  var pf=document.getElementById('prog-fill');if(pf)pf.style.width=pct+'%';
  var pt=document.getElementById('prog-txt');if(pt)pt.textContent=done+' / '+W.length+' weeks';
}

function nextLesson(){
  if(curLs<W[curWk].lessons.length-1){goLesson(curLs+1);}
  else if(curWk<W.length-1){curWk++;curLs=0;document.querySelectorAll('.wk-btn').forEach(function(b,i){b.classList.toggle('sel',i===curWk);});renderWeekOverview();goLesson(0);}
}
function saveExp(key){
  var ta=document.getElementById('exp-ta');if(!ta)return;
  EXP[key]=ta.value;sv('exp',EXP);
  var ok=document.getElementById('exp-ok');
  if(ok){ok.style.display='inline';setTimeout(function(){ok.style.display='none';},1800);}
}

  var pw=document.getElementById('ed-pw-input').value;

    edUnlocked=true;
    renderEditorUnlocked();

    var err=document.getElementById('ed-err');

    setTimeout(function(){err.textContent='';},2500);

function lockEditor(){

function edToggleLesson(li){
  var body=document.getElementById('edls-body-'+li);
  var item=document.getElementById('edls-'+li);
  if(!body)return;
  var open=body.classList.toggle('open');
  item.classList.toggle('open',open);
}

/* ══════════════════════════════════════════════
   EDITOR — MUTATIONS
══════════════════════════════════════════════ */
function edCollectWeek(){
  /* read current week form values back into W */
  var w=W[edWk];
  var titleEl=document.getElementById('ed-wk-title');
  var nEl=document.getElementById('ed-wk-n');
  var startEl=document.getElementById('ed-wk-start');
  var endEl=document.getElementById('ed-wk-end');
  var hwEl=document.getElementById('ed-wk-hw');
  var hwLabelEl=document.getElementById('ed-wk-hwlabel');
  if(titleEl)w.title=titleEl.value;
  if(nEl)w.n=parseInt(nEl.value)||w.n;
  if(startEl)w.start=startEl.value;
  if(endEl)w.end=endEl.value;
  if(hwEl)w.hw=hwEl.value||'#';
  if(hwLabelEl)w.hwLabel=hwLabelEl.value;
  w.lessons.forEach(function(l,li){
    var g=function(id){var el=document.getElementById(id);return el?el.value:null;};
    if(g('eld-day-'+li)!==null)l.day=g('eld-day-'+li);
    if(g('eld-date-'+li)!==null)l.date=g('eld-date-'+li);
    if(g('eld-period-'+li)!==null)l.period=g('eld-period-'+li);
    if(g('eld-int-'+li)!==null)l.intentions=g('eld-int-'+li);
    if(g('eld-crit-'+li)!==null)l.criteria=g('eld-crit-'+li);
    if(g('eld-act-'+li)!==null)l.activities=g('eld-act-'+li);
    if(g('eld-res-'+li)!==null)l.resources=g('eld-res-'+li);
  });
}
function edAddWeek(){
  edCollectWeek();
  var n=W.length+1;
  W.push({id:uid(),n:n,title:'New Week '+n,start:'',end:'',hw:'#',hwLabel:'No HW',lessons:[]});
  edWk=W.length-1;
  renderEditorUnlocked();
}
function edDelWeek(e,wi){
  e.stopPropagation();
  if(!confirm('Delete Week '+W[wi].n+' — '+W[wi].title+'? This cannot be undone.'))return;
  W.splice(wi,1);
  if(edWk>=W.length)edWk=Math.max(0,W.length-1);
  renderEditorUnlocked();
}
function edAddLesson(){
  edCollectWeek();
  W[edWk].lessons.push({day:'Monday',date:'',period:'Period 1',intentions:'',criteria:'',activities:'',resources:'',files:[]});
  renderEdWeek();
  /* auto-open the new lesson */
  setTimeout(function(){edToggleLesson(W[edWk].lessons.length-1);},50);
}
function edDelLesson(e,li){
  e.stopPropagation();
  if(!confirm('Delete this lesson?'))return;
  edCollectWeek();
  W[edWk].lessons.splice(li,1);
  renderEdWeek();
}

/* ── FILES ── */
function edAddFileUrl(li){
  var urlEl=document.getElementById('file-url-'+li);
  var nameEl=document.getElementById('file-name-'+li);
  var url=(urlEl&&urlEl.value||'').trim();
  var name=(nameEl&&nameEl.value||'').trim()||url.split('/').pop()||'File';
  if(!url){alert('Please enter a URL first.');return;}
  if(!W[edWk].lessons[li].files)W[edWk].lessons[li].files=[];
  W[edWk].lessons[li].files.push({name:name,url:url});
  if(urlEl)urlEl.value='';
  if(nameEl)nameEl.value='';
  refreshFileList(li);
}
function edDelFile(li,fi){
  W[edWk].lessons[li].files.splice(fi,1);
  refreshFileList(li);
}
function refreshFileList(li){
  var el=document.getElementById('files-list-'+li);if(!el)return;
  var files=W[edWk].lessons[li].files||[];
  el.innerHTML=files.map(function(f,fi){
    return '<span class="file-tag">📄 '+esc(f.name)
      +'<button class="file-tag-del" onclick="edDelFile('+li+','+fi+')" title="Remove">✕</button></span>';
  }).join('');
}
function edHandleDrop(e,li){
  e.preventDefault();
  document.getElementById('dropzone-'+li).classList.remove('drag');
  edHandleFiles(e.dataTransfer.files,li);
}
function edHandleFiles(files,li){
  if(!GHCFG.token){
    edSaveGH();
    if(!GHCFG.token){alert('Please set up GitHub settings first to enable file upload.');return;}
  }
  Array.from(files).forEach(function(file){edUploadToGH(file,li);});
}
function edSaveGH(){
  var o=document.getElementById('gh-owner');
  var r=document.getElementById('gh-repo');
  var t=document.getElementById('gh-token');
  var b=document.getElementById('gh-branch');
  if(o)GHCFG.owner=o.value.trim();
  if(r)GHCFG.repo=r.value.trim();
  if(t)GHCFG.token=t.value.trim();
  if(b)GHCFG.branch=(b.value.trim()||'main');
  sv('ghcfg',GHCFG);
  var st=document.getElementById('gh-status');
  if(st){st.textContent='✓ Saved';st.style.color='var(--grn)';}
  renderEdWeek();
}
async function edUploadToGH(file,li){
  var prog=document.getElementById('upload-prog-'+li);
  if(prog){prog.style.display='block';prog.textContent='Uploading '+file.name+'...';}
  try{
    var reader=new FileReader();
    var b64=await new Promise(function(res,rej){reader.onload=function(e){res(e.target.result.split(',')[1]);};reader.onerror=rej;reader.readAsDataURL(file);});
    var path='files/'+Date.now()+'_'+file.name.replace(/[^a-zA-Z0-9._-]/g,'_');
    var url='https://api.github.com/repos/'+GHCFG.owner+'/'+GHCFG.repo+'/contents/'+path;
    var resp=await fetch(url,{
      method:'PUT',
      headers:{'Authorization':'token '+GHCFG.token,'Content-Type':'application/json'},
      body:JSON.stringify({message:'Upload '+file.name,content:b64,branch:GHCFG.branch||'main'})
    });
    var data=await resp.json();
    if(resp.ok){
      var fileUrl=data.content.download_url;
      if(!W[edWk].lessons[li].files)W[edWk].lessons[li].files=[];
      W[edWk].lessons[li].files.push({name:file.name,url:fileUrl});
      refreshFileList(li);
      if(prog){prog.textContent='✓ '+file.name+' uploaded!';}
      setTimeout(function(){if(prog)prog.style.display='none';},3000);
    } else {
      throw new Error(data.message||'Upload failed');
    }
  } catch(err){
    if(prog){prog.textContent='✗ Error: '+err.message;prog.style.color='var(--red)';}
  }
}

/* ── SAVE ALL ── */
async function edSaveAll(){
  edCollectWeek();
  saveWeeks();
  renderSidebar();

  var flash=document.getElementById('ed-saved-flash');

  /* push to GitHub if configured */
  if(GHCFG.token&&GHCFG.owner&&GHCFG.repo){
    if(flash){flash.textContent='⏳ Saving to GitHub...';flash.classList.add('show');}
    try{
      var content=btoa(unescape(encodeURIComponent(JSON.stringify(W,null,2))));
      /* get existing file SHA if it exists */
      var sha=null;
      var checkResp=await fetch('https://api.github.com/repos/'+GHCFG.owner+'/'+GHCFG.repo+'/contents/data.json',{
        headers:{'Authorization':'token '+GHCFG.token}
      });
      if(checkResp.ok){var checkData=await checkResp.json();sha=checkData.sha;}
      var body={message:'Update lesson data',content:content,branch:GHCFG.branch||'main'};
      if(sha)body.sha=sha;
      var putResp=await fetch('https://api.github.com/repos/'+GHCFG.owner+'/'+GHCFG.repo+'/contents/data.json',{
        method:'PUT',
        headers:{'Authorization':'token '+GHCFG.token,'Content-Type':'application/json'},
        body:JSON.stringify(body)
      });
      if(putResp.ok){
        if(flash){flash.textContent='✓ Saved & pushed to GitHub';flash.style.color='var(--grn)';}
      } else {
        var err=await putResp.json();
        throw new Error(err.message||'GitHub push failed');
      }
    } catch(e){
      if(flash){flash.textContent='⚠ Saved locally — GitHub error: '+e.message;flash.style.color='var(--amb)';}
    }
  } else {
    if(flash){flash.textContent='✓ Saved locally (set up GitHub in file settings to sync across devices)';}
  }
  if(flash){flash.classList.add('show');setTimeout(function(){flash.classList.remove('show');flash.textContent='✓ Saved!';flash.style.color='';},4000);}
}
function edChangePw(){
  var inp=document.getElementById('ed-pw-new');
  if(!inp||!inp.value.trim()){alert('Please enter a new password.');return;}
  EDPW=inp.value.trim();sv('edpw',EDPW);inp.value='';
  alert('Password changed successfully.');
}

/* ══════════════════════════════════════════════
   SECRET EDITOR ACCESS — crest click x10
══════════════════════════════════════════════ */
var _crestClicks = 0;
var _crestTimer = null;
function crestClick(){
  _crestClicks++;
  /* reset counter after 4 seconds of inactivity */
  clearTimeout(_crestTimer);
  _crestTimer = setTimeout(function(){ _crestClicks = 0; }, 4000);

  if(_crestClicks === 5){
    /* subtle hint at halfway */
    var crest = document.getElementById('crest-img');
    if(crest){ crest.style.filter='brightness(1.3)'; setTimeout(function(){crest.style.filter='';},300); }
  }
  if(_crestClicks >= 10){
    _crestClicks = 0;
    clearTimeout(_crestTimer);
    /* reveal the tab and switch to editor */
    var tab = document.getElementById('edit-tab');
    if(tab) tab.style.display='flex';
    switchTab('editor');
    /* brief flash on crest */
    var crest2 = document.getElementById('crest-img');
    if(crest2){ crest2.style.filter='brightness(1.5)'; setTimeout(function(){crest2.style.filter='';},400); }
  }
}

/* ══════════════════════════════════════════════
   INIT — fetch data.json from GitHub if available
══════════════════════════════════════════════ */
async function init(){
  /* try to load from GitHub Pages data.json first */
  try{
    var resp=await fetch('data.json?_='+Date.now());
    if(resp.ok){
      var fresh=await resp.json();
      if(Array.isArray(fresh)&&fresh.length>0){
        W=fresh;
        sv('weeks',W); /* update local cache */
      }
    }
  }catch(e){
    /* no data.json yet — use localStorage or hardcoded default */
  }
  W.forEach(function(w,wi){if(getStatus(w)==='current')curWk=wi;});
  renderMood();renderSidebar();renderWeekOverview();
}
init();
