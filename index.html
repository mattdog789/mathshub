<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maths Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0a0f;
  --surface: #111118;
  --surface2: #1a1a24;
  --surface3: #22222f;
  --border: rgba(255,255,255,0.07);
  --border2: rgba(255,255,255,0.12);
  --text: #f0f0f8;
  --text2: #9090a8;
  --text3: #5a5a72;
  --accent: #7c3aed;
  --accent2: #a855f7;
  --accent3: #c084fc;
  --glow: rgba(124,58,237,0.15);
  --glow2: rgba(168,85,247,0.08);
  --green: #10b981;
  --amber: #f59e0b;
  --red: #ef4444;
  --cyan: #06b6d4;
  --sidebar-w: 260px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: 'Inter', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  display: flex;
  flex-direction: column;
  min-height: 100vh;
  overflow-x: hidden;
}

/* ── TOPBAR ── */
.topbar {
  height: 56px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 20px;
  gap: 16px;
  position: sticky;
  top: 0;
  z-index: 100;
  backdrop-filter: blur(12px);
}
.topbar-logo {
  display: flex;
  align-items: center;
  gap: 10px;
  text-decoration: none;
}
.logo-mark {
  width: 32px;
  height: 32px;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  box-shadow: 0 0 16px var(--glow);
}
.logo-text {
  font-size: 15px;
  font-weight: 700;
  color: var(--text);
  letter-spacing: -0.02em;
}
.logo-sub {
  font-size: 11px;
  color: var(--text3);
  font-weight: 400;
}
.topbar-nav {
  display: flex;
  align-items: center;
  gap: 2px;
  margin-left: auto;
}
.topbar-btn {
  padding: 7px 14px;
  border-radius: 8px;
  border: none;
  background: none;
  color: var(--text2);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  font-family: inherit;
  transition: all 0.15s;
  display: flex;
  align-items: center;
  gap: 6px;
  text-decoration: none;
}
.topbar-btn:hover { background: var(--surface2); color: var(--text); }
.topbar-btn.active { background: var(--surface3); color: var(--text); }
.topbar-btn .dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--accent2);
  box-shadow: 0 0 6px var(--accent);
}
.mood-bar {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 6px 12px;
  background: var(--surface2);
  border-radius: 20px;
  border: 1px solid var(--border);
  margin-left: 8px;
}
.mood-bar span { font-size: 10px; color: var(--text3); font-weight: 500; text-transform: uppercase; letter-spacing: 0.06em; }
.mood-emoji { font-size: 18px; cursor: pointer; border-radius: 6px; padding: 2px 3px; transition: all 0.15s; border: 1px solid transparent; }
.mood-emoji:hover { transform: scale(1.2); background: var(--surface3); }
.mood-emoji.active { border-color: var(--accent); background: var(--glow); }

/* ── LAYOUT ── */
.app-body {
  display: flex;
  flex: 1;
  min-height: 0;
}

/* ── SIDEBAR ── */
.sidebar {
  width: var(--sidebar-w);
  flex-shrink: 0;
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  position: sticky;
  top: 56px;
  height: calc(100vh - 56px);
  overflow-y: auto;
  padding: 16px 12px;
  gap: 4px;
}
.sidebar-section {
  font-size: 10px;
  font-weight: 600;
  color: var(--text3);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  padding: 12px 8px 6px;
}
.week-nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 10px;
  border-radius: 8px;
  cursor: pointer;
  transition: all 0.15s;
  border: 1px solid transparent;
  text-decoration: none;
}
.week-nav-item:hover { background: var(--surface2); }
.week-nav-item.active { background: var(--glow2); border-color: rgba(124,58,237,0.25); }
.week-nav-item.current { background: var(--glow); border-color: rgba(124,58,237,0.4); }
.wni-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
}
.wni-dot.past { background: var(--text3); }
.wni-dot.current { background: var(--accent2); box-shadow: 0 0 8px var(--accent); }
.wni-dot.upcoming { background: var(--surface3); border: 1px solid var(--border2); }
.wni-label {
  font-size: 12px;
  font-weight: 500;
  color: var(--text2);
  flex: 1;
  line-height: 1.3;
}
.week-nav-item.current .wni-label { color: var(--text); }
.wni-badge {
  font-size: 9px;
  font-weight: 700;
  padding: 2px 6px;
  border-radius: 10px;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  flex-shrink: 0;
}
.badge-past { background: rgba(16,185,129,0.15); color: var(--green); }
.badge-current { background: rgba(124,58,237,0.2); color: var(--accent3); }
.badge-upcoming { background: var(--surface3); color: var(--text3); }

/* progress bar in sidebar */
.sidebar-progress {
  margin: 8px 8px 4px;
  padding: 12px;
  background: var(--surface2);
  border-radius: 10px;
  border: 1px solid var(--border);
}
.sp-label {
  display: flex;
  justify-content: space-between;
  font-size: 11px;
  color: var(--text3);
  margin-bottom: 8px;
}
.sp-label strong { color: var(--text2); font-weight: 600; }
.sp-bar {
  height: 4px;
  background: var(--surface3);
  border-radius: 4px;
  overflow: hidden;
}
.sp-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--accent), var(--accent2));
  border-radius: 4px;
  box-shadow: 0 0 8px var(--glow);
  transition: width 1s ease;
}

/* ── MAIN CONTENT ── */
.main {
  flex: 1;
  overflow-y: auto;
  padding: 32px;
  min-width: 0;
}

/* ── PAGE HEADER ── */
.page-header {
  margin-bottom: 32px;
}
.page-eyebrow {
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--accent3);
  margin-bottom: 8px;
}
.page-title {
  font-size: 28px;
  font-weight: 700;
  letter-spacing: -0.03em;
  color: var(--text);
  margin-bottom: 6px;
}
.page-sub {
  font-size: 14px;
  color: var(--text2);
  line-height: 1.5;
}

/* ── WEEK CARD ── */
.week-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  margin-bottom: 16px;
  overflow: hidden;
  transition: border-color 0.2s;
  scroll-margin-top: 80px;
}
.week-card:hover { border-color: var(--border2); }
.week-card.is-current {
  border-color: rgba(124,58,237,0.4);
  box-shadow: 0 0 0 1px rgba(124,58,237,0.15), 0 8px 32px rgba(0,0,0,0.4);
}
.week-card-header {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 18px 22px;
  cursor: pointer;
  user-select: none;
  position: relative;
}
.week-card-header::after {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: 16px 16px 0 0;
  pointer-events: none;
}
.week-card.is-current .week-card-header {
  background: linear-gradient(135deg, rgba(124,58,237,0.12), rgba(168,85,247,0.06));
}
.week-number {
  font-size: 11px;
  font-weight: 700;
  color: var(--text3);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  font-family: 'JetBrains Mono', monospace;
  min-width: 50px;
}
.week-card.is-current .week-number { color: var(--accent3); }
.week-title-text {
  flex: 1;
  font-size: 16px;
  font-weight: 600;
  color: var(--text);
  letter-spacing: -0.01em;
}
.week-meta {
  display: flex;
  align-items: center;
  gap: 8px;
}
.status-pill {
  font-size: 11px;
  font-weight: 600;
  padding: 4px 10px;
  border-radius: 20px;
  display: flex;
  align-items: center;
  gap: 5px;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}
.status-pill.past { background: rgba(16,185,129,0.1); color: var(--green); border: 1px solid rgba(16,185,129,0.2); }
.status-pill.current { background: rgba(124,58,237,0.15); color: var(--accent3); border: 1px solid rgba(124,58,237,0.3); }
.status-pill.upcoming { background: var(--surface2); color: var(--text3); border: 1px solid var(--border); }
.status-dot { width: 6px; height: 6px; border-radius: 50%; }
.status-dot.past { background: var(--green); }
.status-dot.current { background: var(--accent2); box-shadow: 0 0 6px var(--accent); }
.status-dot.upcoming { background: var(--text3); }
.week-chevron {
  color: var(--text3);
  font-size: 14px;
  transition: transform 0.3s;
  flex-shrink: 0;
}
.week-card.open .week-chevron { transform: rotate(180deg); }

/* ── WEEK BODY ── */
.week-body {
  display: none;
  border-top: 1px solid var(--border);
}
.week-card.open .week-body { display: block; }

/* ── LESSON ── */
.lesson {
  display: grid;
  grid-template-columns: 140px 1fr 180px;
  border-bottom: 1px solid var(--border);
}
.lesson:last-child { border-bottom: none; }
.lesson-meta {
  padding: 20px 18px;
  border-right: 1px solid var(--border);
  background: rgba(0,0,0,0.2);
}
.lesson-day {
  font-size: 13px;
  font-weight: 700;
  color: var(--accent3);
  margin-bottom: 3px;
}
.lesson-date {
  font-size: 12px;
  color: var(--text3);
  font-family: 'JetBrains Mono', monospace;
  margin-bottom: 3px;
}
.lesson-period {
  font-size: 11px;
  color: var(--text3);
  font-style: italic;
}
.lesson-content {
  padding: 20px 22px;
  border-right: 1px solid var(--border);
}
.content-section {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--accent3);
  margin: 14px 0 6px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.content-section:first-child { margin-top: 0; }
.intent-block {
  font-size: 13px;
  color: var(--text2);
  line-height: 1.6;
  padding: 10px 12px;
  background: rgba(124,58,237,0.06);
  border-left: 2px solid var(--accent);
  border-radius: 0 6px 6px 0;
  margin-bottom: 4px;
}
.activity-chip {
  font-size: 12px;
  color: var(--text2);
  padding: 6px 10px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 6px;
  margin-bottom: 4px;
  line-height: 1.4;
}
.explain-box {
  margin-top: 14px;
  padding: 14px;
  background: rgba(245,158,11,0.05);
  border: 1px solid rgba(245,158,11,0.15);
  border-radius: 10px;
}
.explain-label {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--amber);
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  gap: 5px;
}
.explain-textarea {
  width: 100%;
  background: var(--surface3);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 10px 12px;
  font-size: 13px;
  color: var(--text);
  font-family: inherit;
  min-height: 64px;
  resize: vertical;
  line-height: 1.5;
  transition: border-color 0.2s;
}
.explain-textarea:focus { outline: none; border-color: var(--accent); }
.explain-textarea::placeholder { color: var(--text3); }
.explain-save {
  margin-top: 8px;
  padding: 6px 14px;
  background: var(--surface3);
  border: 1px solid var(--border2);
  border-radius: 6px;
  color: var(--text2);
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  font-family: inherit;
  transition: all 0.15s;
}
.explain-save:hover { background: rgba(124,58,237,0.15); border-color: var(--accent); color: var(--accent3); }
.explain-ok { font-size: 11px; color: var(--green); margin-left: 8px; display: none; }
.lesson-resources {
  padding: 20px 18px;
  background: rgba(0,0,0,0.2);
}
.resource-link {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  color: var(--text3);
  padding: 4px 0;
  text-decoration: none;
  transition: color 0.15s;
  line-height: 1.4;
}
.resource-link:hover { color: var(--accent3); }
.resource-link::before { content: '↗'; font-size: 10px; opacity: 0.5; flex-shrink: 0; }

/* ── HW BUTTON ── */
.hw-row {
  padding: 14px 22px;
  display: flex;
  justify-content: flex-end;
  align-items: center;
  gap: 10px;
  border-top: 1px solid var(--border);
  background: rgba(0,0,0,0.15);
}
.hw-btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 9px 20px;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 600;
  text-decoration: none;
  transition: all 0.2s;
  font-family: inherit;
}
.hw-btn.past {
  background: var(--surface2);
  color: var(--text3);
  border: 1px solid var(--border);
}
.hw-btn.current {
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  color: #fff;
  box-shadow: 0 4px 16px rgba(124,58,237,0.4);
}
.hw-btn.current:hover { box-shadow: 0 6px 24px rgba(124,58,237,0.6); transform: translateY(-1px); }
.hw-btn.upcoming {
  background: var(--surface2);
  color: var(--text2);
  border: 1px solid var(--border2);
}
.hw-btn.upcoming:hover { border-color: var(--accent); color: var(--accent3); }

/* ── TERM NAV BUTTON ── */
.term-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 14px 20px;
  border-radius: 10px;
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text2);
  text-decoration: none;
  font-size: 13px;
  font-weight: 600;
  margin-top: 8px;
  transition: all 0.2s;
}
.term-btn:hover { border-color: var(--border2); color: var(--text); background: var(--surface2); }

/* ── SCROLLBAR ── */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--surface3); border-radius: 10px; }
::-webkit-scrollbar-thumb:hover { background: var(--border2); }

/* ── GLOW ORBS background ── */
.orb {
  position: fixed;
  border-radius: 50%;
  filter: blur(80px);
  pointer-events: none;
  z-index: 0;
  opacity: 0.35;
}
.orb1 { width: 400px; height: 400px; background: var(--accent); top: -100px; right: -100px; }
.orb2 { width: 300px; height: 300px; background: var(--cyan); bottom: 100px; left: 200px; opacity: 0.12; }

/* ensure content above orbs */
.topbar, .sidebar, .main { position: relative; z-index: 1; }
</style>
</head>

<!-- ── APP BODY ── -->

var EXP = mhLoad('exp', {});
var MOODS = mhLoad('moods', []);

// ── STATUS ──
function getStatus(w) {
  var t = new Date(); t.setHours(0,0,0,0);
  var s = new Date(w.start), e = new Date(w.end); e.setHours(23,59,59,999);
  return t > e ? 'past' : t >= s ? 'current' : 'upcoming';
}

// ── ESC ──
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// ── MOOD ──
function setMood(emoji) {
  var today = new Date().toISOString().split('T')[0];
  MOODS = MOODS.filter(function(m){ return m.d !== today; });
  MOODS.push({d:today, m:emoji});
  if (MOODS.length > 30) MOODS = MOODS.slice(-30);
  mhSave('moods', MOODS);
  renderMood();
}
function renderMood() {
  var today = new Date().toISOString().split('T')[0];
  var tm = MOODS.find(function(m){ return m.d === today; });
  document.querySelectorAll('.mood-emoji').forEach(function(el) {
    el.classList.toggle('active', !!(tm && el.dataset.mood === tm.m));
  });
  var streak = 0, d = new Date();
  for (var i = 0; i < 30; i++) {
    var ds = d.toISOString().split('T')[0];
    if (MOODS.find(function(m){ return m.d === ds; })) { streak++; d.setDate(d.getDate()-1); } else break;
  }
  var sl = document.getElementById('streak-label');
  if (sl) sl.textContent = streak > 1 ? '🔥'+streak : '';
}

// ── SAVE EXPLAIN ──
function saveExp(key) {
  var el = document.getElementById('exp-'+key);
  if (!el) return;
  EXP[key] = el.value;
  mhSave('exp', EXP);
  var ok = document.getElementById('exp-ok-'+key);
  if (ok) { ok.style.display = 'inline'; setTimeout(function(){ ok.style.display='none'; }, 1800); }
}

// ── TOGGLE WEEK ──
function toggleWeek(id) {
  var card = document.getElementById('wc-'+id);
  if (!card) return;
  var isOpen = card.classList.contains('open');
  card.classList.toggle('open', !isOpen);
  // update sidebar active
  document.querySelectorAll('.week-nav-item').forEach(function(el) {
    el.classList.toggle('active', el.dataset.week === id && !isOpen);
  });
}

// ── RENDER SIDEBAR ──
function renderSidebar() {
  var nav = document.getElementById('week-nav');
  if (!nav) return;
  nav.innerHTML = '';
  var completed = 0;
  DATA.weeks.forEach(function(week, wi) {
    var st = getStatus(week);
    if (st === 'past') completed++;
    var dotClass = st === 'past' ? 'past' : st === 'current' ? 'current' : 'upcoming';
    var badgeText = st === 'past' ? 'Done' : st === 'current' ? 'Now' : '';
    var badgeClass = st === 'past' ? 'badge-past' : st === 'current' ? 'badge-current' : '';
    nav.insertAdjacentHTML('beforeend',
      '<div class="week-nav-item'+(st==='current'?' current':'')+'" data-week="'+week.id+'" onclick="scrollToWeek(\''+week.id+'\')">' +
        '<div class="wni-dot '+dotClass+'"></div>' +
        '<div class="wni-label">Wk '+(wi+1)+' · '+esc(week.title)+'</div>' +
        (badgeText ? '<span class="wni-badge '+badgeClass+'">'+badgeText+'</span>' : '') +
      '</div>'
    );
  });
  // progress
  var pct = DATA.weeks.length > 0 ? Math.round(completed/DATA.weeks.length*100) : 0;
  var fill = document.getElementById('sp-fill');
  var txt = document.getElementById('sp-text');
  if (fill) fill.style.width = pct+'%';
  if (txt) txt.textContent = completed+' / '+DATA.weeks.length;
}

function scrollToWeek(id) {
  var card = document.getElementById('wc-'+id);
  if (!card) return;
  if (!card.classList.contains('open')) toggleWeek(id);
  card.scrollIntoView({behavior:'smooth', block:'start'});
  document.querySelectorAll('.week-nav-item').forEach(function(el) {
    el.classList.toggle('active', el.dataset.week === id);
  });
}

// ── RENDER WEEKS ──
function renderWeeks() {
  // update titles
  var topTitle = document.getElementById('top-title');
  if (topTitle) topTitle.textContent = DATA.title || 'Maths Hub';
  var termBtn = document.getElementById('term-btn');
  if (termBtn) { termBtn.textContent = DATA.termLabel || '← Term 1'; termBtn.href = DATA.termUrl || '#'; }
  var termSide = document.getElementById('term-link-sidebar');
  if (termSide) { termSide.textContent = DATA.termLabel || '← Term 1'; termSide.href = DATA.termUrl || '#'; }

  var container = document.getElementById('weeks-container');
  if (!container) return;
  container.innerHTML = '';

  DATA.weeks.forEach(function(week, wi) {
    var st = getStatus(week);
    var statusClass = st;
    var statusText = st === 'past' ? 'Complete' : st === 'current' ? 'In Progress' : 'Upcoming';

    var lessonsHtml = week.lessons.map(function(lesson, li) {
      var key = week.id+'_'+li;
      var saved = EXP[key] || '';
      var acts = (lesson.activities||'').split('\n').filter(Boolean)
        .map(function(l){ return '<div class="activity-chip">'+esc(l)+'</div>'; }).join('');
      var crit = (lesson.criteria||'').split('\n').filter(Boolean)
        .map(function(l){ return esc(l); }).join('<br>');
      var res = (lesson.resources||'').split('\n').filter(Boolean)
        .map(function(l){ return '<a class="resource-link" href="#">'+esc(l)+'</a>'; }).join('');

      return '<div class="lesson">' +
        '<div class="lesson-meta">' +
          '<div class="lesson-day">'+esc(lesson.day)+'</div>' +
          '<div class="lesson-date">'+esc(lesson.date)+'</div>' +
          '<div class="lesson-period">'+esc(lesson.period)+'</div>' +
        '</div>' +
        '<div class="lesson-content">' +
          (lesson.intentions ?
            '<div class="content-section">🎯 Intentions</div>' +
            '<div class="intent-block">'+esc(lesson.intentions)+'</div>' : '') +
          (lesson.criteria ?
            '<div class="content-section">✅ Success Criteria</div>' +
            '<div class="intent-block">'+crit+'</div>' : '') +
          (lesson.activities ?
            '<div class="content-section">📝 Activities</div>' + acts : '') +
          '<div class="explain-box">' +
            '<div class="explain-label">✍️ Explain it back</div>' +
            '<textarea class="explain-textarea" id="exp-'+key+'" placeholder="Explain this lesson in your own words...">'+esc(saved)+'</textarea>' +
            '<button class="explain-save" onclick="saveExp(\''+key+'\')">Save</button>' +
            '<span class="explain-ok" id="exp-ok-'+key+'">✓ Saved</span>' +
          '</div>' +
        '</div>' +
        '<div class="lesson-resources">'+res+'</div>' +
      '</div>';
    }).join('');

    var hwBtnClass = st === 'past' ? 'past' : st === 'current' ? 'current' : 'upcoming';

    var html =
      '<div class="week-card'+(st==='current'?' is-current':'')+'" id="wc-'+week.id+'">' +
        '<div class="week-card-header" onclick="toggleWeek(\''+week.id+'\')">' +
          '<span class="week-number">Week '+(wi+1).toString().padStart(2,'0')+'</span>' +
          '<span class="week-title-text">'+esc(week.title)+'</span>' +
          '<div class="week-meta">' +
            '<span class="status-pill '+statusClass+'">' +
              '<span class="status-dot '+statusClass+'"></span>'+statusText+
            '</span>' +
          '</div>' +
          '<span class="week-chevron">▾</span>' +
        '</div>' +
        '<div class="week-body">' +
          lessonsHtml +
          '<div class="hw-row">' +
            '<a href="'+esc(week.hwLink||'#')+'" target="_blank" rel="noopener" class="hw-btn '+hwBtnClass+'">'+esc(week.hwLabel||'Homework')+' →</a>' +
          '</div>' +
        '</div>' +
      '</div>';

    container.insertAdjacentHTML('beforeend', html);

    // auto-open current week
    if (st === 'current') {
      var card = document.getElementById('wc-'+week.id);
      if (card) card.classList.add('open');
    }
  });
}

// ── INIT ──
renderMood();
renderSidebar();
renderWeeks();

// scroll current week into view after render
setTimeout(function() {
  var cur = document.querySelector('.week-card.is-current');
  if (cur) cur.scrollIntoView({behavior:'smooth', block:'start'});
}, 200);
